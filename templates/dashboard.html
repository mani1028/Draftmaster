<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Draft Master AI</title>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-layout">
        
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header" style="justify-content: center;">
                <div class="brand-item">
                    <img src="/static/logo.png" alt="Draft Master" class="sidebar-logo"> 
                </div>
                <button class="mobile-close-btn mobile-only" onclick="toggleSidebar()">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-label">Workspace</div>
                    <button class="nav-item active" onclick="switchTab('generator', event)">
                        <i class="fas fa-pen-fancy"></i> <span>Editor</span>
                    </button>
                    <button class="nav-item" onclick="switchTab('history', event)">
                        <i class="fas fa-history"></i> <span>History</span>
                    </button>
                </div>

                <div class="nav-section">
                    <div class="nav-label">Library</div>
                    <button class="nav-item" onclick="filterTemplates('All', event)">
                        <i class="fas fa-th-large"></i> <span>All Templates</span>
                    </button>
                    <button class="nav-item" onclick="filterTemplates('Email', event)">
                        <i class="fas fa-envelope"></i> <span>Emails</span>
                    </button>
                    <button class="nav-item" onclick="filterTemplates('Business', event)">
                        <i class="fas fa-briefcase"></i> <span>Business</span>
                    </button>
                    <button class="nav-item" onclick="filterTemplates('Marketing', event)">
                        <i class="fas fa-bullhorn"></i> <span>Marketing</span>
                    </button>
                    <button class="nav-item" onclick="filterTemplates('HR', event)">
                        <i class="fas fa-user-shield"></i> <span>HR & Legal</span>
                    </button>
                </div>
            </nav>

            <div class="user-profile-section">
                <div class="user-avatar">G</div>
                <div class="user-info">
                    <div class="user-name">Guest User</div>
                    <div class="user-plan">Pro Plan</div>
                </div>
                <button class="logout-btn" onclick="window.location.href='/login'"><i class="fas fa-sign-out-alt"></i></button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            
            <!-- Mobile Header -->
            <header class="top-bar">
                <div class="top-bar-left">
                    <button class="icon-btn mobile-only" onclick="toggleSidebar()">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="breadcrumbs" id="pageTitle">
                        <span class="crumb-muted">Drafts</span>
                        <span class="crumb-sep">/</span>
                        <span class="crumb-active">Untitled Document</span>
                    </div>
                </div>

                <div class="top-bar-right">
                    <!-- Config Toggle for Mobile -->
                    <button class="btn btn-outline mobile-only" onclick="toggleConfigPanel()">
                        <i class="fas fa-sliders-h"></i> Settings
                    </button>

                    <div class="action-buttons">
                        <button class="btn btn-outline" onclick="exportDoc('pdf')" title="Export PDF">
                            <i class="fas fa-file-pdf"></i> <span class="desktop-only">Export</span>
                        </button>
                        <button class="btn btn-primary" onclick="saveDraft()">
                            <i class="fas fa-save"></i> <span class="desktop-only">Save Draft</span>
                        </button>
                    </div>
                </div>
            </header>

            <!-- GENERATOR VIEW -->
            <div class="workspace" id="generatorView">
                
                <!-- LEFT: Configuration Panel -->
                <div class="config-panel" id="configPanel">
                    <div class="panel-header-mobile mobile-only">
                        <h3>Document Settings</h3>
                        <button class="icon-btn" onclick="toggleConfigPanel()"><i class="fas fa-times"></i></button>
                    </div>

                    <div class="config-scroll-area">
                        <!-- Section 1: Setup -->
                        <div class="config-section">
                            <h3 class="config-heading"><i class="fas fa-layer-group"></i> Type & Template</h3>
                            
                            <div class="form-group">
                                <label class="label-sm">Category</label>
                                <div class="select-wrapper">
                                    <select id="categorySelect" class="form-select" onchange="handleCategoryChange(this.value)">
                                        <option value="" disabled selected>Select Category...</option>
                                    </select>
                                    <i class="fas fa-chevron-down select-arrow"></i>
                                </div>
                            </div>
                    
                            <div class="form-group disabled" id="templateContainer">
                                <label class="label-sm">Template</label>
                                <div class="select-wrapper">
                                    <select id="templateSelect" class="form-select" onchange="handleTemplateChange(this.value)">
                                        <option value="" disabled selected>Select Template...</option>
                                    </select>
                                    <i class="fas fa-chevron-down select-arrow"></i>
                                </div>
                            </div>
                        </div>

                        <!-- Section 2: Details -->
                        <div class="config-section">
                            <h3 class="config-heading"><i class="fas fa-sliders-h"></i> Context</h3>
                            
                            <div class="form-group">
                                <label class="label-sm">Document Title</label>
                                <input type="text" id="docTitle" class="form-input" placeholder="e.g. Q1 Marketing Report">
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label class="label-sm">Tone</label>
                                    <div class="select-wrapper">
                                        <select id="toneSelect" class="form-select">
                                            <option>Professional</option>
                                        </select>
                                        <i class="fas fa-chevron-down select-arrow"></i>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="label-sm">Audience</label>
                                    <div class="select-wrapper">
                                        <select id="audienceSelect" class="form-select">
                                            <option>General</option>
                                        </select>
                                        <i class="fas fa-chevron-down select-arrow"></i>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="label-sm">Key Points & Instructions</label>
                                <textarea id="userPrompt" class="form-textarea" placeholder="What should this document cover? List key facts, names, or goals..."></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="config-footer">
                        <button class="btn btn-primary btn-block btn-lg" onclick="generateContent()" id="genBtn">
                            <i class="fas fa-sparkles"></i> Generate
                        </button>
                    </div>
                </div>

                <!-- RIGHT: Editor Area -->
                <div class="editor-area">
                    <div class="editor-toolbar">
                        <div class="toolbar-group">
                            <button class="tool-btn" onclick="rewriteContent('Grammar Fix')" title="Fix Grammar"><i class="fas fa-check-double"></i> Fix</button>
                            <button class="tool-btn" onclick="rewriteContent('Shorter')" title="Shorten"><i class="fas fa-compress-alt"></i> Shorten</button>
                            <button class="tool-btn mobile-hidden" onclick="rewriteContent('More Persuasive')"><i class="fas fa-magic"></i> Polish</button>
                        </div>
                        <div class="toolbar-divider"></div>
                        <button class="tool-btn primary-text" onclick="continueWriting()">
                            <i class="fas fa-pen-nib"></i> Continue Writing
                        </button>
                    </div>

                    <div class="paper-container">
                        <div class="paper">
                            <textarea id="outputEditor" class="paper-content" placeholder="Your generated content will appear here..."></textarea>
                        </div>
                    </div>
                </div>

            </div>
            
            <!-- TEMPLATE LIBRARY VIEW -->
            <div id="templatesView" class="view-container hidden">
                 <div class="view-header">
                    <h2>Template Library</h2>
                    <p>Choose a professional template to jumpstart your writing.</p>
                 </div>
                 <div id="allTemplatesContainer" class="grid-layout">
                     <!-- Populated by JS -->
                 </div>
            </div>
            
            <!-- HISTORY VIEW -->
            <div id="historyView" class="view-container hidden">
                 <div class="view-header">
                    <h2>Document History</h2>
                    <p>Access your past drafts and exports.</p>
                 </div>
                 <div id="draftsList" class="list-layout">
                     <!-- Populated by JS -->
                 </div>
            </div>

        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="/static/js/app.js"></script>
</body>
</html>
