<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Draft Master AI</title>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-layout">
        
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-feather-alt" style="color: var(--primary);"></i> 
                <span>Draft Master</span>
            </div>

            <nav class="sidebar-nav">
                <div class="menu-category">Menu</div>
                <button class="menu-item active" onclick="switchTab('generator')">
                    <i class="fas fa-pen-fancy w-5"></i> Editor
                </button>
                <button class="menu-item" onclick="switchTab('history')">
                    <i class="fas fa-clock w-5"></i> History
                </button>
                
                <div class="menu-category">Library</div>
                <button class="menu-item" onclick="filterTemplates('All')">
                    <i class="fas fa-th-large"></i> All Templates
                </button>

                <div class="menu-category">Categories</div>
                <button class="menu-item" onclick="filterTemplates('Email')">
                    <i class="fas fa-envelope"></i> Emails
                </button>
                <button class="menu-item" onclick="filterTemplates('Business')">
                    <i class="fas fa-briefcase"></i> Business
                </button>
                <button class="menu-item" onclick="filterTemplates('Marketing')">
                    <i class="fas fa-bullhorn"></i> Marketing
                </button>
                <button class="menu-item" onclick="filterTemplates('HR')">
                    <i class="fas fa-users"></i> HR & Legal
                </button>
                <button class="menu-item" onclick="filterTemplates('Personal')">
                    <i class="fas fa-heart"></i> Personal
                </button>
            </nav>

            <div class="user-profile">
                <div style="width: 36px; height: 36px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white;">G</div>
                <div>
                    <div style="font-size: 0.9rem; font-weight: 600; color: white;">Guest User</div>
                    <div style="font-size: 0.75rem; color: var(--text-muted);">Pro Plan</div>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            
            <!-- Top Bar -->
            <header class="top-bar">
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <!-- Mobile Toggles -->
                    <button class="mobile-only btn btn-ghost" onclick="toggleSidebar()" aria-label="Menu">
                        <i class="fas fa-bars"></i>
                    </button>
                    <button class="mobile-only btn btn-ghost" onclick="toggleConfigPanel()" aria-label="Settings" style="color: var(--primary);">
                        <i class="fas fa-sliders-h"></i>
                    </button>
                    
                    <div class="page-title" id="pageTitle">
                        <span style="color:var(--text-muted); font-weight:400;">Write / </span> Untitled
                    </div>
                </div>

                <div style="display: flex; gap: 0.5rem;">
                    <button class="btn btn-secondary" onclick="exportDoc('pdf')">
                        <i class="fas fa-download"></i> <span class="desktop-only">PDF</span>
                    </button>
                    <button class="btn btn-primary" onclick="saveDraft()">
                        <i class="fas fa-save"></i> <span class="desktop-only">Save Draft</span>
                    </button>
                </div>
            </header>

            <!-- GENERATOR VIEW -->
            <div class="workspace" id="generatorView">
                
                <!-- LEFT: Configuration Panel -->
                <div class="config-panel" id="configPanel">
                    <div class="panel-header mobile-only">
                        <span>Document Settings</span>
                        <button class="btn btn-ghost" onclick="toggleConfigPanel()"><i class="fas fa-times"></i></button>
                    </div>

                    <div class="form-group">
                        <label class="form-label">1. Setup</label>
                        
                        <!-- Container 1: Category -->
                        <div class="selection-container">
                            <label class="sub-label">Category</label>
                            <div class="input-wrapper">
                                <i class="fas fa-layer-group input-icon"></i>
                                <select id="categorySelect" class="input-control with-icon" onchange="handleCategoryChange(this.value)">
                                    <option value="" disabled selected>Select a Category...</option>
                                    <!-- Populated via JS -->
                                </select>
                            </div>
                        </div>
                
                        <!-- Container 2: Template -->
                        <div class="selection-container" id="templateContainer" style="opacity: 0.6; pointer-events: none;">
                            <label class="sub-label">Template</label>
                            <div class="input-wrapper">
                                <i class="fas fa-file-alt input-icon"></i>
                                <select id="templateSelect" class="input-control with-icon" onchange="handleTemplateChange(this.value)">
                                    <option value="" disabled selected>-- First Select Category --</option>
                                    <!-- Populated via JS -->
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">2. Document Title</label>
                        <input type="text" id="docTitle" class="input-control" placeholder="e.g. Q1 Marketing Report">
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label">Tone</label>
                            <select id="toneSelect" class="input-control">
                                <!-- Populated dynamically based on category -->
                                <option>Professional</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Audience</label>
                            <select id="audienceSelect" class="input-control">
                                <!-- Populated dynamically based on category -->
                                <option>General</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">3. Key Points & Details</label>
                        <textarea id="userPrompt" class="input-control" placeholder="Describe the goal, key facts, and any specific details..."></textarea>
                    </div>

                    <button class="btn btn-primary btn-full" onclick="generateContent()" id="genBtn">
                        <i class="fas fa-sparkles"></i> Generate Document
                    </button>
                </div>

                <!-- RIGHT: Editor Area -->
                <div class="editor-area">
                    <div class="paper">
                        <div class="paper-toolbar">
                            <div style="display: flex; gap: 0.5rem; flex: 1;">
                                <button class="btn btn-ghost" onclick="rewriteContent('Grammar Fix')"><i class="fas fa-check"></i> Fix</button>
                                <button class="btn btn-ghost" onclick="rewriteContent('Shorter')"><i class="fas fa-compress"></i> Shorten</button>
                                <button class="btn btn-ghost mobile-hidden" onclick="rewriteContent('More Persuasive')"><i class="fas fa-bolt"></i> Punchy</button>
                            </div>
                            <button class="btn btn-ghost" style="color: var(--primary); font-weight: 600;" onclick="continueWriting()">
                                <i class="fas fa-magic"></i> <span class="desktop-only">Continue</span>
                            </button>
                        </div>
                        <textarea id="outputEditor" class="paper-textarea" placeholder="Select a template and generate content to start writing..."></textarea>
                    </div>
                </div>

            </div>
            
            <!-- TEMPLATE LIBRARY VIEW (New) -->
            <div id="templatesView" class="hidden" style="background: var(--bg-body); height: 100%; overflow-y: auto;">
                 <div style="max-width: 1200px; margin: 0 auto;">
                     <div style="padding: 2rem;">
                        <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem; color:var(--text-main);">Template Library</h2>
                        <p style="color: var(--text-muted);">Browse our collection of professional templates to get started.</p>
                     </div>
                     <div id="allTemplatesContainer" class="history-grid">
                         <!-- Loaded via JS -->
                     </div>
                 </div>
            </div>
            
            <!-- HISTORY VIEW (Hidden) -->
            <div id="historyView" class="hidden" style="background: var(--bg-body); height: 100%; overflow-y: auto;">
                 <div style="max-width: 1200px; margin: 0 auto;">
                     <div style="padding: 2rem;">
                        <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem; color:var(--text-main);">Your Drafts</h2>
                        <p style="color: var(--text-muted);">Resume working on your previous documents.</p>
                     </div>
                     <div id="draftsList" class="history-grid">
                         <!-- Loaded via JS -->
                     </div>
                 </div>
            </div>

        </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast" style="position: fixed; bottom: 30px; right: 30px; background: #0f172a; color: white; padding: 12px 24px; border-radius: 8px; opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 1000; box-shadow: var(--shadow-lg); font-weight: 500;">
        Notification
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
