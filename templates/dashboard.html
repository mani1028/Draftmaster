<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draft Master | Workspace</title>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Sophisticated SaaS Palette */
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-soft: #eef2ff;
            --success: #10b981;
            --bg-main: #f9fafb;
            --bg-sidebar: #ffffff;
            --text-heading: #111827;
            --text-body: #4b5563;
            --text-muted: #9ca3af;
            --border-base: #f3f4f6;
            --border-strong: #e5e7eb;
            
            --sidebar-width: 260px;
            --header-height: 64px;
            
            /* Elevation Shadows */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
            --shadow-paper: 0 20px 25px -5px rgba(0, 0, 0, 0.03), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.2s, border-color 0.2s; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-main);
            color: var(--text-body);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- Global Layout --- */
        .app-layout {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* --- Sidebar Redesign --- */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-base);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 50;
        }

        .sidebar-header {
            height: var(--header-height);
            padding: 0 1.25rem;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-base);
        }

        .brand-item { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            font-weight: 700; 
            color: var(--text-heading); 
            font-size: 1rem; 
            letter-spacing: -0.01em;
        }
        .sidebar-logo { height: 28px; width: auto; }

        .sidebar-nav { flex: 1; padding: 1.25rem 0.75rem; overflow-y: auto; }
        .nav-section { margin-bottom: 1.75rem; }
        .nav-label {
            padding: 0 0.75rem;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.6rem 0.75rem;
            border-radius: 8px;
            color: var(--text-body);
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            border: none;
            background: transparent;
            text-align: left;
            font-size: 0.875rem;
            margin-bottom: 2px;
        }

        .nav-item i { width: 18px; text-align: center; color: var(--text-muted); font-size: 0.95rem; }
        .nav-item:hover { background: var(--bg-main); color: var(--text-heading); }
        .nav-item:hover i { color: var(--primary); }
        .nav-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
        .nav-item.active i { color: var(--primary); }

        .user-profile-section {
            padding: 0.875rem;
            margin: 0.75rem;
            background: #fff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--border-base);
            box-shadow: var(--shadow-sm);
        }

        .user-avatar {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.75rem;
        }

        .user-info { flex: 1; min-width: 0; }
        .user-name { font-weight: 600; color: var(--text-heading); font-size: 0.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .user-plan { font-size: 0.65rem; color: var(--text-muted); }
        .logout-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; border-radius: 4px; }
        .logout-btn:hover { color: #ef4444; background: #fee2e2; }

        /* --- Main Interface --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            position: relative;
        }

        .top-bar {
            height: var(--header-height);
            background: #fff;
            border-bottom: 1px solid var(--border-base);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            flex-shrink: 0;
            z-index: 10;
        }

        .breadcrumbs { display: flex; align-items: center; gap: 8px; font-size: 0.8125rem; }
        .crumb-muted { color: var(--text-muted); font-weight: 500; }
        .crumb-sep { color: var(--text-muted); opacity: 0.4; }
        .crumb-active { font-weight: 600; color: var(--text-heading); }

        /* --- Workspace --- */
        .workspace { display: flex; flex: 1; overflow: hidden; }

        .config-panel {
            width: 320px;
            background: #fff;
            border-right: 1px solid var(--border-base);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .config-scroll-area { padding: 1.5rem; flex: 1; overflow-y: auto; }
        .config-section { margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--bg-main); }
        .config-section:last-child { border-bottom: none; }
        .config-heading {
            font-size: 0.7rem; font-weight: 800; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.08em;
            margin-bottom: 1.25rem; display: flex; align-items: center; gap: 8px;
        }
        .config-heading i { color: var(--primary); opacity: 0.7; }

        .form-group { margin-bottom: 1.25rem; }
        .form-label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-heading); margin-bottom: 0.5rem; }
        .form-input, .form-select, .form-textarea {
            width: 100%; padding: 0.625rem 0.875rem; border: 1px solid var(--border-strong);
            border-radius: 8px; font-size: 0.875rem; background: #fff; font-family: inherit;
            color: var(--text-heading); transition: all 0.2s;
        }
        .form-textarea { min-height: 120px; resize: none; line-height: 1.6; }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft);
        }

        .config-footer { padding: 1.25rem; border-top: 1px solid var(--border-base); }

        /* --- Editor Environment --- */
        .editor-area {
            flex: 1;
            padding: 2.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f8fafc;
        }

        .editor-toolbar {
            width: 100%; max-width: 820px;
            background: #fff; padding: 0.5rem;
            border-radius: 12px; margin-bottom: 1.75rem;
            display: flex; gap: 0.25rem; border: 1px solid var(--border-base);
            box-shadow: var(--shadow-sm);
            position: sticky; top: 0; z-index: 5;
        }

        .tool-btn {
            background: transparent; border: none; padding: 0.5rem 0.875rem;
            border-radius: 8px; font-size: 0.75rem; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
            color: var(--text-body); transition: all 0.2s;
        }
        .tool-btn:hover { background: var(--bg-main); color: var(--text-heading); }
        .tool-btn i { font-size: 0.85rem; opacity: 0.7; }

        .paper {
            width: 100%; max-width: 820px;
            background: #fff; min-height: 1050px;
            padding: 5rem 6rem; border-radius: 2px;
            box-shadow: var(--shadow-paper); border: 1px solid var(--border-base);
            position: relative;
        }
        .paper::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: var(--primary); border-radius: 2px 2px 0 0; opacity: 0.1;
        }

        .paper-content {
            width: 100%; height: 100%; border: none; resize: none;
            font-family: 'Inter', -apple-system, sans-serif; font-size: 1.0625rem; line-height: 1.8;
            color: var(--text-heading); outline: none; background: transparent;
        }

        /* --- Generic UI Elements --- */
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 0.5rem 1.125rem; border-radius: 8px; font-weight: 600;
            font-size: 0.8125rem; cursor: pointer; transition: all 0.2s;
            border: 1px solid transparent; text-decoration: none;
        }
        .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2); }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: 0 4px 6px rgba(79, 70, 229, 0.25); }
        .btn-outline { background: #fff; border-color: var(--border-strong); color: var(--text-body); }
        .btn-outline:hover { background: var(--bg-main); border-color: var(--text-muted); }
        .btn-block { width: 100%; }
        .btn-lg { padding: 0.875rem 1rem; font-size: 0.9375rem; }

        /* Grid & Card Redesign */
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
        .draft-card {
            background: #fff; border: 1px solid var(--border-base);
            padding: 1.5rem; border-radius: 12px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer; display: flex; flex-direction: column; gap: 0.75rem;
        }
        .draft-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--primary); }
        
        .card-icon {
            width: 36px; height: 36px; border-radius: 8px;
            background: var(--primary-soft); color: var(--primary);
            display: flex; align-items: center; justify-content: center; font-size: 1rem;
        }

        /* Views */
        .view-container { padding: 3rem; overflow-y: auto; flex: 1; max-width: 1200px; margin: 0 auto; width: 100%; }
        .view-header { margin-bottom: 2.5rem; }
        .view-header h2 { font-size: 1.875rem; font-weight: 800; color: var(--text-heading); margin-bottom: 0.5rem; letter-spacing: -0.02em; }
        .view-header p { color: var(--text-muted); font-size: 1rem; font-weight: 500; }

        .toast {
            position: fixed; bottom: 2rem; right: 2rem;
            background: #0f172a; color: #fff; padding: 0.875rem 1.5rem;
            border-radius: 10px; box-shadow: var(--shadow-lg);
            z-index: 1000; opacity: 0; transform: translateY(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            pointer-events: none; font-size: 0.875rem; font-weight: 600;
            display: flex; align-items: center; gap: 10px;
        }

        .hidden { display: none !important; }
        .mobile-only { display: none !important; }

        /* Animation */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }

        @media (max-width: 1024px) {
            .sidebar { position: absolute; left: 0; top: 0; bottom: 0; transform: translateX(-100%); transition: transform 0.3s ease; }
            .sidebar.open { transform: translateX(0); box-shadow: 20px 0 50px rgba(0,0,0,0.1); }
            .mobile-only { display: flex !important; }
            .config-panel { display: none; }
            .paper { padding: 3rem 2rem; }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand-item">
                    <img src="/static/logo.png" alt="Draft Master" class="sidebar-logo">
                    <span>AI Writing Platform</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-label">Workspace</div>
                    <button class="nav-item active" onclick="switchTab('generator', event)">
                        <i class="fas fa-feather"></i> <span>Write & Edit</span>
                    </button>
                    <button class="nav-item" onclick="switchTab('history', event)">
                        <i class="fas fa-clock-rotate-left"></i> <span>Recent Drafts</span>
                    </button>
                    <button class="nav-item" onclick="switchTab('templates', event)">
                        <i class="fas fa-grid-2"></i> <span>Templates</span>
                    </button>
                </div>

                <div class="nav-section">
                    <div class="nav-label">Browse</div>
                    <button class="nav-item" onclick="filterTemplates('Email', event)">
                        <i class="fas fa-envelope-open-text"></i> <span>Emails</span>
                    </button>
                    <button class="nav-item" onclick="filterTemplates('Business', event)">
                        <i class="fas fa-briefcase"></i> <span>Business</span>
                    </button>
                    <button class="nav-item" onclick="filterTemplates('Marketing', event)">
                        <i class="fas fa-bullhorn"></i> <span>Marketing</span>
                    </button>
                </div>
            </nav>

            <div class="user-profile-section">
                <div class="user-avatar">JD</div>
                <div class="user-info">
                    <div class="user-name">{{ session.get('user_name', 'Guest User') }}</div>
                    <div class="user-plan">Pro Member</div>
                </div>
                <button class="logout-btn" onclick="window.location.href='/logout'" title="Log Out">
                    <i class="fas fa-power-off"></i>
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            
            <header class="top-bar">
                <div class="top-bar-left">
                    <button class="icon-btn mobile-only" onclick="toggleSidebar()" style="background:none; border:none; color:var(--text-body); font-size:1.1rem; margin-right:1rem; cursor:pointer;">
                        <i class="fas fa-bars-staggered"></i>
                    </button>
                    <div class="breadcrumbs">
                        <span class="crumb-muted">Documents</span>
                        <span class="crumb-sep">/</span>
                        <span class="crumb-active" id="activeDocTitle">Drafting Workspace</span>
                    </div>
                </div>

                <div class="top-bar-right">
                    <button class="btn btn-outline" onclick="exportDoc('pdf')">
                        <i class="fas fa-download"></i> <span>Export PDF</span>
                    </button>
                    <button class="btn btn-primary" onclick="saveDraft()">
                        <i class="fas fa-cloud-check"></i> <span>Save Changes</span>
                    </button>
                </div>
            </header>

            <!-- GENERATOR VIEW -->
            <div class="workspace" id="generatorView">
                
                <!-- LEFT: Configuration Panel -->
                <div class="config-panel">
                    <div class="config-scroll-area">
                        <div class="config-section">
                            <h3 class="config-heading"><i class="fas fa-cog"></i> Configuration</h3>
                            
                            <div class="form-group">
                                <label class="form-label">Category</label>
                                <select id="categorySelect" class="form-select" onchange="handleCategoryChange(this.value)">
                                    <option value="" disabled selected>Select category...</option>
                                </select>
                            </div>
                    
                            <div class="form-group disabled" id="templateContainer">
                                <label class="form-label">Template</label>
                                <select id="templateSelect" class="form-select" onchange="handleTemplateChange(this.value)">
                                    <option value="" disabled selected>Choose a template...</option>
                                </select>
                            </div>
                        </div>

                        <div class="config-section">
                            <h3 class="config-heading"><i class="fas fa-wand-sparkles"></i> Personalization</h3>
                            
                            <div class="form-group">
                                <label class="form-label">Document Title</label>
                                <input type="text" id="docTitle" class="form-input" placeholder="e.g. Investor Update Jan">
                            </div>

                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                                <div class="form-group">
                                    <label class="form-label">Tone</label>
                                    <select id="toneSelect" class="form-select"></select>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">Target Audience</label>
                                    <select id="audienceSelect" class="form-select"></select>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="form-label">Key Instructions</label>
                                <textarea id="userPrompt" class="form-textarea" placeholder="Describe the purpose, specific data points, or key names to include..."></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="config-footer">
                        <button class="btn btn-primary btn-block btn-lg" onclick="generateContent()" id="genBtn">
                            <i class="fas fa-sparkles"></i> Generate Draft
                        </button>
                    </div>
                </div>

                <!-- RIGHT: Editor Area -->
                <div class="editor-area">
                    <div class="editor-toolbar">
                        <button class="tool-btn" onclick="rewriteContent('Grammar Fix')" title="Fix Grammar"><i class="fas fa-check-circle"></i> Grammar</button>
                        <button class="tool-btn" onclick="rewriteContent('Shorter')" title="Make Concise"><i class="fas fa-compress"></i> Shorten</button>
                        <button class="tool-btn" onclick="rewriteContent('More Persuasive')" title="Polish Style"><i class="fas fa-magic"></i> Polish</button>
                        <div style="flex: 1;"></div>
                        <button class="tool-btn" style="color: var(--primary); font-weight: 700;" onclick="continueWriting()">
                            <i class="fas fa-plus-circle"></i> Continue Writing
                        </button>
                    </div>

                    <div class="paper animate-fade">
                        <textarea id="outputEditor" class="paper-content" placeholder="AI-generated content will flow here..."></textarea>
                    </div>
                </div>

            </div>
            
            <!-- TEMPLATE LIBRARY VIEW -->
            <div id="templatesView" class="view-container hidden">
                 <div class="view-header">
                    <h2>Template Library</h2>
                    <p>Standardized frameworks for every professional need.</p>
                 </div>
                 <div id="allTemplatesContainer" class="grid-layout animate-fade"></div>
            </div>
            
            <!-- HISTORY VIEW -->
            <div id="historyView" class="view-container hidden">
                 <div class="view-header">
                    <h2>Recent Activity</h2>
                    <p>Review and resume your latest generated documents.</p>
                 </div>
                 <div id="draftsList" class="grid-layout animate-fade"></div>
            </div>

        </main>
    </div>

    <div id="toast" class="toast">
        <i class="fas fa-info-circle"></i>
        <span id="toastMsg"></span>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
